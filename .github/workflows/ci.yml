name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CI: "true"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NO_UPDATE_NOTIFIER: "1"

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - macos-14
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal --component rustfmt,clippy
      - name: Select pinned Rust toolchain
        run: rustup default 1.92.0
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --locked --workspace --all-targets --all-features
      - name: Build both command names
        run: cargo build --locked --workspace --bins
      - name: Smoke-test canonical command
        run: cargo run --locked --quiet --bin crawlson -- version
      - name: Smoke-test alias command
        run: cargo run --locked --quiet --bin clson -- version
      - name: Test demo script arguments
        shell: bash
        run: bash tests/test_demo_script.sh

  real-browser:
    name: real agent-browser demo
    # Crawlson intentionally does not forward CI to the driver, because
    # agent-browser uses it to disable Chrome's sandbox. Downloaded Chrome can
    # retain its sandbox on this runner image; Ubuntu 24.04 AppArmor currently
    # blocks that sandbox before the first browser command.
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned Node runtime
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          check-latest: false
      - name: Create retained CI log directory
        run: mkdir -p ci-artifacts
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.92.0 --profile minimal
      - name: Select pinned Rust toolchain
        run: rustup default 1.92.0
      - name: Install supported agent-browser
        shell: bash
        run: |
          set -Eeuo pipefail
          npm install --global --ignore-scripts --no-audit --no-fund agent-browser@0.26.0 \
            2>&1 | tee ci-artifacts/agent-browser-package.log
          CRAWLSON_AB_ROOT="$(npm root --global)/agent-browser"
          CRAWLSON_AB_BIN="$CRAWLSON_AB_ROOT/bin/agent-browser-linux-x64"
          chmod 755 "$CRAWLSON_AB_BIN"
          CRAWLSON_AB_VERSION="$("$CRAWLSON_AB_BIN" --version)"
          printf '%s\n' "$CRAWLSON_AB_VERSION" | tee ci-artifacts/agent-browser-version.txt
          test "$CRAWLSON_AB_VERSION" = "agent-browser 0.26.0"
          echo "AGENT_BROWSER_REAL_BIN=$CRAWLSON_AB_BIN" >> "$GITHUB_ENV"
      - name: Install browser runtime and Linux dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          "$AGENT_BROWSER_REAL_BIN" install --with-deps \
            2>&1 | tee ci-artifacts/agent-browser-install.log
      - name: Resolve installer-managed Chrome for Testing
        shell: bash
        run: |
          set -Eeuo pipefail
          CRAWLSON_BROWSER_CACHE="$(cd "$HOME/.agent-browser/browsers" && pwd -P)"
          shopt -s nullglob
          CRAWLSON_BROWSER_CANDIDATES=(
            "$CRAWLSON_BROWSER_CACHE"/chrome-*/chrome
          )
          test "${#CRAWLSON_BROWSER_CANDIDATES[@]}" -eq 1
          CRAWLSON_BROWSER_BIN="${CRAWLSON_BROWSER_CANDIDATES[0]}"
          test -f "$CRAWLSON_BROWSER_BIN"
          test ! -L "$CRAWLSON_BROWSER_BIN"
          test -x "$CRAWLSON_BROWSER_BIN"
          CRAWLSON_BROWSER_VERSION="$("$CRAWLSON_BROWSER_BIN" --version)"
          [[ "$CRAWLSON_BROWSER_VERSION" == *"Chrome for Testing"* ]]
          CRAWLSON_BROWSER_BIN="$(
            cd "$(dirname "$CRAWLSON_BROWSER_BIN")" && pwd -P
          )/$(basename "$CRAWLSON_BROWSER_BIN")"
          printf '%s\n' "$CRAWLSON_BROWSER_VERSION" \
            | tee ci-artifacts/extension-browser-version.txt
          echo "CRAWLSON_REAL_BROWSER_BIN=$CRAWLSON_BROWSER_BIN" >> "$GITHUB_ENV"
      - name: Require sandboxed upstream launch diagnostics
        shell: bash
        run: |
          set -Eeuo pipefail
          env -u CI "$AGENT_BROWSER_REAL_BIN" doctor --offline --json \
            2>&1 | tee ci-artifacts/agent-browser-doctor.json
      - name: Package and run the documented complete demo
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo build --locked --workspace --release --bins \
            2>&1 | tee ci-artifacts/release-build.log
          CRAWLSON_PACKAGE_DIR="$RUNNER_TEMP/crawlson-release-package"
          CRAWLSON_EXTRACT_DIR="$RUNNER_TEMP/crawlson-release-extract"
          target/release/crawlson-release package \
            --target x86_64-unknown-linux-gnu \
            --bin-dir target/release \
            --source-dir . \
            --out-dir "$CRAWLSON_PACKAGE_DIR" \
            2>&1 | tee ci-artifacts/release-package.log
          CRAWLSON_PACKAGE=""
          for candidate in "$CRAWLSON_PACKAGE_DIR"/*.tar.gz; do
            [[ -f "$candidate" ]] || continue
            [[ -z "$CRAWLSON_PACKAGE" ]] || {
              echo "multiple Linux release bundles were generated" >&2
              exit 1
            }
            CRAWLSON_PACKAGE="$candidate"
          done
          [[ -n "$CRAWLSON_PACKAGE" ]]
          mkdir -p "$CRAWLSON_EXTRACT_DIR"
          tar -xzf "$CRAWLSON_PACKAGE" -C "$CRAWLSON_EXTRACT_DIR"
          CRAWLSON_BUNDLE_ROOT=""
          for candidate in "$CRAWLSON_EXTRACT_DIR"/*; do
            [[ -d "$candidate" ]] || continue
            [[ -z "$CRAWLSON_BUNDLE_ROOT" ]] || {
              echo "Linux release archive has multiple roots" >&2
              exit 1
            }
            CRAWLSON_BUNDLE_ROOT="$candidate"
          done
          [[ -n "$CRAWLSON_BUNDLE_ROOT" ]]
          echo "CRAWLSON_REAL_CLI_BIN=$CRAWLSON_BUNDLE_ROOT/bin/crawlson" >> "$GITHUB_ENV"
          echo "CRAWLSON_REAL_DEMO_BIN=$CRAWLSON_BUNDLE_ROOT/bin/crawlson-demo" >> "$GITHUB_ENV"
          "$CRAWLSON_BUNDLE_ROOT/scripts/demo.sh" \
            --crawlson-bin "$CRAWLSON_BUNDLE_ROOT/bin/crawlson" \
            --demo-bin "$CRAWLSON_BUNDLE_ROOT/bin/crawlson-demo" \
            --agent-browser "$AGENT_BROWSER_REAL_BIN" \
            --browser-executable "$CRAWLSON_REAL_BROWSER_BIN" \
            --output-dir "$GITHUB_WORKSPACE/ci-artifacts/demo" \
            2>&1 | tee ci-artifacts/demo-command.log
      - name: Require the real-browser integration
        env:
          CRAWLSON_REAL_BROWSER: required
        shell: bash
        run: |
          set -Eeuo pipefail
          cargo test --test real_agent_browser --locked -- --ignored --nocapture \
            2>&1 | tee ci-artifacts/real-browser-test.log
      - name: Upload real-browser evidence and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crawlson-real-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-artifacts
          if-no-files-found: error
          retention-days: 14

  ci:
    name: CI
    if: always()
    needs:
      - test
      - real-browser
    runs-on: ubuntu-22.04
    steps:
      - name: Require every platform job
        env:
          TEST_RESULT: ${{ needs.test.result }}
          REAL_BROWSER_RESULT: ${{ needs.real-browser.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$REAL_BROWSER_RESULT" = success
