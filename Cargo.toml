[package]
name = "crawlson"
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
description = "Agent-driven browser journeys with reproducible evidence"
repository = "https://github.com/jmitchel3/crawlson"
publish = false
default-run = "crawlson"
autobins = false

[[bin]]
name = "crawlson"
path = "src/bin/crawlson.rs"

[[bin]]
name = "clson"
path = "src/bin/clson.rs"

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
atomic-write-file = "0.3.0"
directories = "6.0.0"
minisign-verify = "0.2.5"
png = "=0.18.1"
semver = { version = "1.0.28", features = ["serde"] }
self-replace = "1.5.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
thiserror = "2.0.19"
toml = "1.1.3"
ureq = { version = "3.3.0", features = ["json"] }
url = "2.5.8"
wait-timeout = "0.2.1"

[dev-dependencies]
assert_cmd = "2.2.2"
jsonschema = { version = "0.49.1", default-features = false }
predicates = "3.1.4"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
