[package]
name = "crawlson-release"
version = "0.0.0"
edition = "2024"
rust-version = "1.92"
publish = false

[dependencies]
clap = { version = "4.6.4", features = ["derive"] }
crawlson = { path = "../.." }
flate2 = "1.1.9"
minisign = "0.9.1"
minisign-verify = "0.2.5"
semver = "1.0.28"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
tar = { version = "0.4.46", default-features = false }
tempfile = "3.27.0"
thiserror = "2.0.19"
zip = { version = "8.6.0", default-features = false }

[dev-dependencies]
assert_cmd = "2.2.2"
jsonschema = { version = "0.49.1", default-features = false }
